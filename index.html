const badge=()=>'';

const lockOpt=c=>opt(`${c.i}. ${esc(c.title)}`,`<span>${t('Create this concept.','Buat konsep ini.')}</span>`,`S.concept=${c.i};go('d0')`);
function durField(){const cur=String(S.d.dur);return `<div class="fl"><span>${t('Duration (seconds) — up to 6 scenes','Durasi (detik) — hingga 6 adegan')}</span><div class="chips">${['10','20','30','40','50','60'].map(x=>`<button class="chip ${cur==x?'on':''}" onclick="S.d.dur=${x};render(true)">${x}</button>`).join('')}</div></div>`}

function projectSnapshot(){return{...S,files:{c:[],p:[]},hist:[]}}\nfunction writeLocalProject(){try{localStorage.setItem('adsPromptGeneratorProject',JSON.stringify({version:1,savedAt:new Date().toISOString(),S:projectSnapshot()}));return true}catch(e){return false}}\nlet autoSaveTimer=null;function queueAutoSave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>{const ok=writeLocalProject();const el=document.getElementById('autosaveStatus');if(el)el.textContent=ok?t('Auto-saved on this device','Tersimpan otomatis di perangkat ini'):t('Auto-save unavailable — export JSON','Simpan otomatis gagal — ekspor JSON')},500)}\nfunction saveProject(){if(writeLocalProject())alert(t('Project saved in this browser.','Proyek tersimpan di browser ini.'));else alert(t('Could not save here. Export the project instead.','Tidak bisa menyimpan di browser. Silakan ekspor proyek.'))}
function openSavedProject(){try{const raw=localStorage.getItem('adsPromptGeneratorProject');if(!raw){alert(t('No saved project found.','Belum ada proyek tersimpan.'));return}const data=JSON.parse(raw);if(!data.S)throw 0;Object.assign(S,data.S);S.files={c:[],p:[]};S.hist=[];render();alert(t('Project opened. Reselect uploaded images if needed.','Proyek dibuka. Pilih ulang gambar upload jika diperlukan.'))}catch(e){alert(t('Could not open saved project.','Proyek tersimpan tidak bisa dibuka.'))}}
function downloadText(name,content,type='text/plain'){const blob=new Blob([content],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportProject(){const data={app:'ADS PROMPT GENERATOR',version:1,exportedAt:new Date().toISOString(),project:{...S,files:{c:[],p:[]},hist:[]}};downloadText('ads-prompt-project.json',JSON.stringify(data,null,2),'application/json')}
function importProject(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result),p=data.project||data;if(!p||!p.c||!p.p||!p.d)throw 0;Object.assign(S,p);S.files={c:[],p:[]};S.hist=[];render();alert(t('Project imported. Reselect uploaded images if needed.','Proyek diimpor. Pilih ulang gambar upload jika diperlukan.'))}catch(e){alert(t('Invalid project file.','File proyek tidak valid.'))}};reader.readAsText(file);input.value=''}
function downloadAllPrompts(){const out=videos().join('\n\n------------------------------\n\n');downloadText('ads-video-prompts.txt',out)}
function settingsField(key,label,options){const cur=S.d[key]||options[0][0];return '<div class="fl"><span>'+label+'</span><select onchange="S.d.'+key+'=this.value;render(true)">'+options.map(x=>'<option value="'+esc(x[0])+'" '+(cur===x[0]?'selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div>'}
function projectTools(){return '<div class="blk"><h3>'+t('Project tools','Peralatan proyek')+'</h3><p class="note" id="autosaveStatus">'+t('Auto-save is enabled on this browser.','Simpan otomatis aktif di browser ini.')+'</p><div class="row"><button class="btn s" onclick="saveProject()">'+t('Save project','Simpan proyek')+'</button><button class="btn s" onclick="openSavedProject()">'+t('Open saved','Buka tersimpan')+'</button><button class="btn s" onclick="exportProject()">'+t('Export JSON','Ekspor JSON')+'</button><label class="btn s" style="cursor:pointer">'+t('Import JSON','Impor JSON')+'<input type="file" accept="application/json,.json" onchange="importProject(this)" style="display:none"></label></div><p class="note">'+t('Browser save is local to this device. Export JSON to move the project. Uploaded image files are not embedded.','Simpan browser hanya berlaku di perangkat ini. Ekspor JSON untuk memindahkan proyek. File gambar upload tidak ikut disimpan.')+'</p></div>'}


/* ---------- OPTION CHIPS ---------- */
function chips(o,k,label,opts,multi){
 if(FREE.lockedFields.includes(o+'.'+k))return lockedField(label);
 if(multi)return chipsOld(o,k,label,opts,multi);
 const key=o+'.'+k;R[key]=opts;const cur=S[o][k]||'';const vals=opts.map(x=>x.split('~')[0]);
 const cust=S.cu[key]||(cur&&!vals.includes(cur));
 const os=opts.map(x=>{const[val,idl]=x.split('~');return `<option value="${esc(val)}" ${!cust&&cur==val?'selected':''}>${esc(S.lang=='id'&&idl?idl:val)}</option>`}).join('');
 return `<div class="fl"><span>${label}</span><select onchange="selChange('${key}',this.value)"><option value="">${t('— Your choice —','— Pilihan kreator —')}</option>${os}<option value="__c" ${cust?'selected':''}>${t('Custom…','Lainnya…')}</option></select>${cust?`<input type="text" data-o="${o}" data-k="${k}" value="${esc(cur)}" placeholder="${t('Type your own…','Tulis sendiri…')}">`:''}</div>`}
function selChange(key,val){const[o,k]=key.split('.');if(val=='__c'){S.cu[key]=true;S[o][k]=''}else{S.cu[key]=false;S[o][k]=val}render(true)}
function chipsOld(o,k,label,opts,multi){
 const key=o+'.'+k;R[key]=opts;const cur=S[o][k]||'';
 const vals=opts.map(x=>x.split('~')[0]);const sel=multi?cur.split(', ').filter(Boolean):[cur];
 const cust=!multi&&(S.cu[key]||(cur&&!vals.includes(cur)));
 const ch=opts.map((x,i)=>{const[val,idl]=x.split('~');return `<button class="chip ${!cust&&sel.includes(val)?'on':''}" onclick="pickChip('${key}',${i},${multi?1:0})">${esc(S.lang=='id'&&idl?idl:val)}</button>`}).join('');
 const cb=multi?'':`<button class="chip ${cust?'on':''}" onclick="pickCustom('${key}')">${t('Custom…','Lainnya…')}</button>`;
 return `<div class="fl"><span>${label}</span><div class="chips">${ch}${cb}</div>${cust?`<input type="text" data-o="${o}" data-k="${k}" value="${esc(cur)}" placeholder="${t('Type your own…','Tulis sendiri…')}">`:''}</div>`;
}
function pickChip(key,i,multi){const[o,k]=key.split('.');const val=R[key][i].split('~')[0];S.cu[key]=false;
 if(multi){let a=(S[o][k]||'').split(', ').filter(Boolean);a=a.includes(val)?a.filter(x=>x!=val):[...a,val].slice(-3);S[o][k]=a.join(', ')}else S[o][k]=S[o][k]==val?'':val;render(true)}
function pickCustom(key){const[o,k]=key.split('.');S.cu[key]=true;S[o][k]='';render(true)}
const txt=(o,k,label,ph)=>`<div class="fl"><span>${label}</span><input type="text" data-o="${o}" data-k="${k}" value="${esc(S[o][k]||'')}" placeholder="${ph}"></div>`;
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.o)S[d.o][d.k]=e.target.value;else if(d.s)S[d.s]=e.target.value;else if(d.scene!==undefined&&d.field){const i=+d.scene;if(!S.scr)S.scr=tplScenes(nScenes());if(S.scr[i])S.scr[i][d.field]=e.target.value;S.trSig=sig()}queueAutoSave()});

/* ---------- COPY (works in iframes) ---------- */
const blk=(title,text)=>{C.push(text);return `<div class="blk"><div class="bh"><span>${title}</span><button class="btn s" onclick="cp(${C.length-1},this)">${t('Copy','Salin')}</button></div><pre>${esc(text)}</pre></div>`};
function cp(i,b){const x=C[i];let ok=false;
 try{const a=document.createElement('textarea');a.value=x;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,x.length);ok=document.execCommand('copy');a.remove()}catch(_){}
 const good=()=>{b.textContent=t('Copied ✓','Tersalin ✓');b.classList.add('ok');setTimeout(()=>{b.textContent=t('Copy','Salin');b.classList.remove('ok')},1500)};
 const manual=()=>{const pre=b.closest('.blk').querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=t('Press Ctrl/Cmd+C','Tekan Ctrl/Cmd+C')};
 if(ok)good();else if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x).then(good,manual);else manual()}

/* ---------- CLAUDE CONNECTOR: published runtime OR direct Anthropic API (works when this file is uploaded to Claude as an artifact) ---------- */
function toB64(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1024,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>rej(new Error('image'));im.src=u})}
async function getSample(){\n let rt=null;try{rt=window.claude&&claude.use?await claude.use('sample'):null}catch(e){}\n if(!rt)return null;\n const f=async(prompt,o={})=>rt(prompt,o);\n f.limits=async()=>rt.limits?await rt.limits():{images:true};\n return f}\n\n/* ---------- UPLOAD + ANALYZE ---------- */
function uploader(k,label){const f=S.files[k];
 return `<div class="fl"><span>${label}</span><input type="file" accept="image/*" multiple data-up="${k}"></div><div class="th">${f.map(x=>`<img src="${URL.createObjectURL(x)}">`).join('')}</div>
 ${f.length?`<button class="btn" id="an" onclick="analyze('${k}')">🔍 ${k=='c'?t('Analyze character','Analisa karakter'):t('Analyze product','Analisa produk')}</button>`:''}<div class="note" id="am">${esc(S.msg)}</div>`}
async function analyze(k){const m=document.getElementById('am'),b=document.getElementById('an');
 try{const sample=await getSample();
  if(!sample){m.textContent=t('Auto-analysis unavailable here. Please pick the options below manually.','Analisa otomatis tidak tersedia di sini. Pilih opsi di bawah secara manual.');return}
  const lim=await sample.limits();if(!lim.images){m.textContent=t('Image analysis unavailable. Pick options manually.','Analisa gambar tidak tersedia. Pilih opsi manual.');return}

 catch(e){S.scr=null;S.trErr=t('Auto-writing unavailable — a template script (English, 18–25 words per scene) was used.','Penulisan otomatis tidak tersedia — dipakai skrip template (Inggris, 18–25 kata per adegan).')}

function storyboardPreview(sc){return '<div class="storyboard-grid">'+sc.map((x,i)=>'<div class="scene-card"><div class="scene-thumb"><span>FRAME '+String(i+1).padStart(2,'0')+' · '+mmss(i*10)+'</span></div><b>'+t('Scene','Adegan')+' '+(i+1)+' · '+mmss(i*10)+'–'+mmss((i+1)*10)+'</b><p>'+esc(x.v)+'</p></div>').join('')+'</div><p class="note">'+t('This is a layout preview from your scene descriptions, not a generated image or video.','Ini pratinjau tata letak dari deskripsi adegan, bukan gambar atau video hasil generate.')+'</p>'}\nfunction videos(){
 const N=nScenes(),NL=S.d.nl||'English',n=cn(),p=pn(),loc=lo(),c=concepts()[(S.concept||1)-1],ratio=S.d.ratio||'9:16',style=S.d.style||'Authentic UGC',platform=S.d.platform||'TikTok',voice=S.d.voice||'Natural female voice',music=S.d.music||'None',sfx=S.d.sfx||'Natural ambience',continuity=S.d.consistency||'Strict';
 const sc=S.scr&&S.scr.length==N?S.scr:tplScenes(N),out=[];
 for(let k=0;k<N;k++){const x=sc[k];out.push([`VIDEO PROMPT ${k+1} OF ${N} (${mmss(k*10)}–${mmss(k*10+10)})`,
 `REFERENCES: Use the attached Character Sheet, Product Sheet and Location Sheet as the only identity references. Same face, hair, outfit, body, product design, branding and location in every frame. ${ratio} aspect ratio, ${style} visual style for ${platform}, filming approach (${c.film}), natural lighting, slight handheld movement. One continuous 10-second shot.`,
 `NO TEXT: There is no on-screen text of any kind: no captions, subtitles, titles, overlays, stickers, emojis, graphics, watermarks or UI. The only readable text is the real printed branding on the physical product.`,
 `AUDIO: ${n} speaks the Spoken Line below in a ${voice} style, naturally paced across the full 10 seconds. Music: ${music}. Sound effects: ${sfx}. No voice-over, no narrator, no other voices.`,
 `NARRATION LANGUAGE: ${NL}. The Spoken Line is spoken in ${NL}. All other instructions are in English.`,
 `CONTINUITY (${continuity}): ${k==0?'Opening video — hook in the first 3 seconds':`Continues directly from Video ${k}: ${n} holding ${p} at chest height in the ${loc}, same framing and energy.`} Keep the same face, hair, outfit, body proportions, product shape, colors, logo placement and location across every scene.`,'',
 `(Shot: ${mmss(k*10)}–${mmss(k*10+10)})`,`- Visual: ${x.v}.`,`- Spoken Line (${NL}, ${wc(x.s)} words): "${x.s}"`,`- Delivery: ${x.d}.`,
 `END FRAME: ${n} holding ${p} at chest height, looking at the camera, ${loc} behind them.`,'',
 NEG+'on-screen text, captions, subtitles, text overlays, stickers, emojis, graphics, watermark, voice-over, narrator, extra voices, different face or outfit between scenes, altered product design or logo, extra people, distorted hands'].join('\n'))}
 return out}
