html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--tx);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 10% -10%,color-mix(in srgb,#7c5cff 28%,transparent),transparent),radial-gradient(700px 500px at 100% 0%,color-mix(in srgb,#ff4d8d 20%,transparent),transparent),var(--bg)}

.chip:hover{border-color:#7c5cff}.chip.on{background:var(--g);color:#fff;border-color:transparent;font-weight:600}
.fl{margin-bottom:12px}.fl>span{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:6px}
input[type=text],input[type=number]{width:100%;margin-top:8px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--code);color:var(--tx);font:inherit;font-size:14px}
input[type=file]{width:100%;padding:12px;border:1.5px dashed var(--bd);border-radius:12px;background:var(--code);color:var(--mu);font:inherit;font-size:13px}

.btn:disabled{opacity:.5}.btn.s{background:transparent;color:#7c5cff;border:1px solid #7c5cff;padding:6px 14px;margin:0;font-size:12px;box-shadow:none}.btn.s.ok{color:var(--ok);border-color:var(--ok)}

.opt:hover{border-color:#7c5cff;transform:translateY(-1px)}.opt b{display:block;font-size:15px}.opt span{color:var(--mu);font-size:13px;line-height:1.5}
.blk{margin-top:16px}.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mu)}
pre{margin:0;background:var(--code);border:1px solid var(--bd);border-radius:14px;padding:14px;white-space:pre-wrap;word-break:break-word;font:12.5px/1.55 ui-monospace,Menlo,monospace;user-select:text}
.lock{color:var(--ok);font-weight:700;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.th img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}

.up{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--g);color:#fff;text-decoration:none;font-weight:800;font-size:13px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(124,92,255,.35)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px dashed #7c5cff;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.pb{font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--g);padding:2px 7px;border-radius:999px;letter-spacing:.04em;margin-left:4px;white-space:nowrap}
.lkf{cursor:pointer}.lkf .fake{padding:11px 12px;border:1px dashed var(--bd);border-radius:12px;background:var(--code);color:var(--mu);font-size:14px;opacity:.8}.lkf:hover .fake{border-color:#7c5cff}
.opt.locked{opacity:.65;border-style:dashed}.chip.lockc{opacity:.65;border-style:dashed}

</style></head><body><div class="w">
<div class="top"><div class="logo"><i>🎬</i><div><h1>ADS PROMPT GENERATOR <span class="free">UNLOCKED</span></h1><p class="tag" id="tag"></p></div></div><div class="lang" id="lang"></div></div>
<div class="banner" id="bn"></div><div class="pg" id="pg"></div><div class="panel" id="panel"></div>
<div class="foot">Generator by <b>BBU CHANNEL</b></div></div>
<div class="modal" id="pro" onclick="if(event.target===this)closePro()"></div>
<script>
const S={lang:'id',st:'c0',hist:[],cm:'',pm:'',c:{},p:{cat:'Beauty'},cu:{},q:{},d:{dur:20,nl:'English'},files:{c:[],p:[]},msg:'',loc:null,lcn:'',lcd:'',concept:1,tr:null,trSig:'',trBusy:false,trErr:''};
const t=(e,i)=>S.lang=='id'?i:e;
const R={},C=[];const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const v=(o,k)=>(S[o][k]||'').trim();const J=a=>a.filter(Boolean).join(', ');
const stageOf=s=>({c:1,p:2,l:3,k:4,d:5,v:6})[s[0]];
function go(s){S.hist.push(S.st);S.st=s;S.msg='';render();scrollTo(0,0)}
function back(){S.st=S.hist.pop();render()}
const nav=(label,to,extra='')=>`<div class="row">${label?`<button class="btn" onclick="${extra}go('${to}')">${label}</button>`:''}${S.hist.length?`<button class="btn g2" onclick="back()">← ${t('Back','Kembali')}</button>`:''}</div>`;

/* ---------- LOCAL UNLOCKED CONFIG ---------- */
const PRO_URL='';
const FREE={scenes:6,concepts:10,nl:[],customOK:['c.name','c.eth','c.under','c.height','c.pers','c.expr','c.acc','p.finish','p.mat','p.feat','p.type','p.shape','p.colors','p.brand','l.location'],lockedFields:[]};
const badge=()=>'';
function proHTML(){return ''}
function showPro(){return}
function closePro(){return}
const lockedField=label=>'';
const lockOpt=c=>opt(`${c.i}. ${esc(c.title)}`,`<span>${t('Create this concept.','Buat konsep ini.')}</span>`,`S.concept=${c.i};go('d0')`);
function durField(){const cur=String(S.d.dur);return `<div class="fl"><span>${t('Duration (seconds) — up to 6 scenes','Durasi (detik) — hingga 6 adegan')}</span><div class="chips">${['10','20','30','40','50','60'].map(x=>`<button class="chip ${cur==x?'on':''}" onclick="S.d.dur=${x};render(true)">${x}</button>`).join('')}</div></div>`}
function nlField(){const cur=S.d.nl||'English';return `<div class="fl"><span>${t('Narration language (spoken lines & on-screen text)','Bahasa narasi (ucapan & teks di layar)')}</span><select onchange="nlChange(this.value)">${O.nl.map(x=>{const[val,idl]=x.split('~');return `<option value="${esc(val)}" ${cur==val?'selected':''}>${esc(S.lang=='id'&&idl?idl:val)}</option>`}).join('')}</select></div>`}
function nlChange(val){S.d.nl=val;render(true)}
const upsell=()=>'';

/* ---------- OPTION CHIPS ---------- */
function chips(o,k,label,opts,multi){
 if(FREE.lockedFields.includes(o+'.'+k))return lockedField(label);
 if(multi)return chipsOld(o,k,label,opts,multi);
 const key=o+'.'+k;R[key]=opts;const cur=S[o][k]||'';const vals=opts.map(x=>x.split('~')[0]);
 const cust=S.cu[key]||(cur&&!vals.includes(cur));
 const os=opts.map(x=>{const[val,idl]=x.split('~');return `<option value="${esc(val)}" ${!cust&&cur==val?'selected':''}>${esc(S.lang=='id'&&idl?idl:val)}</option>`}).join('');
 return `<div class="fl"><span>${label}</span><select onchange="selChange('${key}',this.value)"><option value="">${t('— Your choice —','— Pilihan kreator —')}</option>${os}<option value="__c" ${cust?'selected':''}>${t('Custom…','Lainnya…')}</option></select>${cust?`<input type="text" data-o="${o}" data-k="${k}" value="${esc(cur)}" placeholder="${t('Type your own…','Tulis sendiri…')}">`:''}</div>`}
function selChange(key,val){const[o,k]=key.split('.');if(val=='__c'){S.cu[key]=true;S[o][k]=''}else{S.cu[key]=false;S[o][k]=val}render(true)}
function chipsOld(o,k,label,opts,multi){
 const key=o+'.'+k;R[key]=opts;const cur=S[o][k]||'';
 const vals=opts.map(x=>x.split('~')[0]);const sel=multi?cur.split(', ').filter(Boolean):[cur];
 const cust=!multi&&(S.cu[key]||(cur&&!vals.includes(cur)));
 const ch=opts.map((x,i)=>{const[val,idl]=x.split('~');return `<button class="chip ${!cust&&sel.includes(val)?'on':''}" onclick="pickChip('${key}',${i},${multi?1:0})">${esc(S.lang=='id'&&idl?idl:val)}</button>`}).join('');
 const cb=multi?'':`<button class="chip ${cust?'on':''}" onclick="pickCustom('${key}')">${t('Custom…','Lainnya…')}</button>`;
 return `<div class="fl"><span>${label}</span><div class="chips">${ch}${cb}</div>${cust?`<input type="text" data-o="${o}" data-k="${k}" value="${esc(cur)}" placeholder="${t('Type your own…','Tulis sendiri…')}">`:''}</div>`;
}
function pickChip(key,i,multi){const[o,k]=key.split('.');const val=R[key][i].split('~')[0];S.cu[key]=false;
 if(multi){let a=(S[o][k]||'').split(', ').filter(Boolean);a=a.includes(val)?a.filter(x=>x!=val):[...a,val].slice(-3);S[o][k]=a.join(', ')}else S[o][k]=S[o][k]==val?'':val;render(true)}
function pickCustom(key){const[o,k]=key.split('.');S.cu[key]=true;S[o][k]='';render(true)}
const txt=(o,k,label,ph)=>`<div class="fl"><span>${label}</span><input type="text" data-o="${o}" data-k="${k}" value="${esc(S[o][k]||'')}" placeholder="${ph}"></div>`;
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.o)S[d.o][d.k]=e.target.value;else if(d.s)S[d.s]=e.target.value});
document.addEventListener('change',e=>{const d=e.target.dataset;if(d.up){S.files[d.up]=[...S.files[d.up],...e.target.files].slice(0,d.up=='c'?10:4);render(true)}});

/* ---------- COPY (works in iframes) ---------- */
const blk=(title,text)=>{C.push(text);return `<div class="blk"><div class="bh"><span>${title}</span><button class="btn s" onclick="cp(${C.length-1},this)">${t('Copy','Salin')}</button></div><pre>${esc(text)}</pre></div>`};
function cp(i,b){const x=C[i];let ok=false;
 try{const a=document.createElement('textarea');a.value=x;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,x.length);ok=document.execCommand('copy');a.remove()}catch(_){}
 const good=()=>{b.textContent=t('Copied ✓','Tersalin ✓');b.classList.add('ok');setTimeout(()=>{b.textContent=t('Copy','Salin');b.classList.remove('ok')},1500)};
 const manual=()=>{const pre=b.closest('.blk').querySelector('pre');const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=t('Press Ctrl/Cmd+C','Tekan Ctrl/Cmd+C')};
 if(ok)good();else if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(x).then(good,manual);else manual()}
const opt=(a,b,fn)=>`<div class="opt" onclick="${fn}"><b>${a}</b><span>${b}</span></div>`;

/* ---------- CLAUDE CONNECTOR: published runtime OR direct Anthropic API (works when this file is uploaded to Claude as an artifact) ---------- */
function toB64(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const m=1024,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=()=>rej(new Error('image'));im.src=u})}
async function directAsk(prompt,o={}){
 const content=[];
 for(const f of (o.images||[]))content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await toB64(f)}});
 content.push({type:'text',text:prompt});
 const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content}]})});
 const d=await res.json();if(!res.ok||d.error)throw new Error((d.error&&d.error.message)||('HTTP '+res.status));
 return{text:(d.content||[]).map(i=>i.type==='text'?i.text:'').join('')}}
async function getSample(){
 let rt=null;try{rt=window.claude&&claude.use?await claude.use('sample'):null}catch(e){}
 const f=async(prompt,o={})=>{if(rt){try{return await rt(prompt,o)}catch(e){}}return directAsk(prompt,o)};
 f.limits=async()=>{if(rt){try{return await rt.limits()}catch(e){}}return{images:true}};
 return f}

/* ---------- UPLOAD + ANALYZE ---------- */
function uploader(k,label){const f=S.files[k];
 return `<div class="fl"><span>${label}</span><input type="file" accept="image/*" multiple data-up="${k}"></div><div class="th">${f.map(x=>`<img src="${URL.createObjectURL(x)}">`).join('')}</div>
 ${f.length?`<button class="btn" id="an" onclick="analyze('${k}')">🔍 ${k=='c'?t('Analyze character','Analisa karakter'):t('Analyze product','Analisa produk')}</button>`:''}<div class="note" id="am">${esc(S.msg)}</div>`}
async function analyze(k){const m=document.getElementById('am'),b=document.getElementById('an');
 try{const sample=await getSample();
  if(!sample){m.textContent=t('Auto-analysis unavailable here. Please pick the options below manually.','Analisa otomatis tidak tersedia di sini. Pilih opsi di bawah secara manual.');return}
  const lim=await sample.limits();if(!lim.images){m.textContent=t('Image analysis unavailable. Pick options manually.','Analisa gambar tidak tersedia. Pilih opsi manual.');return}
  b.disabled=true;m.textContent=t('Analyzing images…','Menganalisa gambar…');
  const keys=k=='c'?'gender (Female/Male/Non-binary), age (one of 18–24, 25–34, 35–44, 45–54, 55+), skin (skin tone), eyes (eye color), hairc (hair color), hair (hairstyle), body (Slim/Average/Athletic/Curvy/Plus-size), outfit, acc (accessories or None), feat (distinguishing features)':'type, shape, colors, finish (Matte/Glossy/Metallic), mat (materials), brand (logo and branding placement), feat (buttons, controls, details)';
  const r=await sample(`Analyze the attached ${k=='c'?'person (avatar / model reference)':'product'} image(s). Describe ONLY what is visible, never invent. Return ONLY a JSON object with these string keys: ${keys}. Short English phrases.`,{images:S.files[k],cache:false});
  Object.assign(S[k],JSON.parse((r.text.match(/\{[\s\S]*\}/)||['{}'])[0]));S.msg=t('✅ Analysis done — review and adjust the options below.','✅ Analisa selesai — cek dan ubah opsi di bawah bila perlu.');render(true);
 }catch(e){m.textContent=t('Analysis failed. Please pick options manually.','Analisa gagal. Pilih opsi secara manual.');if(b)b.disabled=false}}

/* ---------- OPTION LISTS (value~Indonesian label) ---------- */
const O={
 name:['Ameela','Maya','Sofia','Zoe','Nina','Jordan','Liam','Aiden'],gender:['Female~Perempuan','Male~Laki-laki','Non-binary~Non-biner'],age:['18–24','25–34','35–44','45–54','55+'],
 eth:['White~Kulit putih','Black~Kulit hitam','East Asian~Asia Timur','South Asian~Asia Selatan','Latina/Hispanic~Latina/Hispanik','Middle Eastern~Timur Tengah','Southeast Asian~Asia Tenggara','Mixed~Campuran'],
 skin:['Porcelain~Porselen','Fair~Cerah','Light~Terang','Medium~Sedang','Tan~Tan','Brown~Cokelat','Deep Dark~Gelap pekat'],under:['Cool~Dingin','Neutral~Netral','Warm~Hangat','Olive~Zaitun'],
 eyes:['Brown~Cokelat','Dark brown~Cokelat tua','Hazel','Green~Hijau','Blue~Biru','Gray~Abu-abu'],hairc:['Black~Hitam','Dark brown~Cokelat tua','Light brown~Cokelat muda','Blonde~Pirang','Auburn','Red~Merah','Gray~Abu-abu'],
 hair:['Long wavy~Panjang bergelombang','Messy bun~Cepol berantakan','Bob','Braids~Kepang','Shoulder-length straight~Lurus sebahu','Curly~Keriting','Short crop~Pendek','Ponytail~Kuncir kuda'],
 body:['Slim~Langsing','Average~Rata-rata','Athletic~Atletis','Curvy~Berlekuk','Plus-size'],height:['Short~Pendek','Average height~Sedang','Tall~Tinggi'],
 outfit:['Casual tee and jeans~Kaos & jeans santai','Oversized hoodie and leggings~Hoodie oversize & legging','Streetwear','Athleisure set~Set athleisure','Business casual','Cozy loungewear~Baju rumah nyaman'],

 colors:['Pastel pink~Pink pastel','White~Putih','Black~Hitam','Navy~Biru navy','Sage green~Hijau sage','Silver~Perak','Beige~Krem'],finish:['Matte~Doff','Glossy~Mengkilap','Metallic~Metalik'],

/* ---------- VIDEO: 1 scene = 10 seconds ---------- */
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const wc=s=>s.trim().split(/\s+/).length,cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fit=(b,fl)=>{let s=b;for(const f of fl){if(wc(s)>=18)break;if(wc(s+' '+f)<=25)s+=' '+f}return s};
const nScenes=()=>Math.min(6,Math.max(1,Math.round((+S.d.dur||20)/10)));
function tplScenes(N){
 const c=concepts()[(S.concept||1)-1],q=Q(),n=cn(),p=pn(),loc=lo(),ft=featTxt();
 const B={hook:{v:`${n} holds ${p} up to the camera in the ${loc}, looking straight into the lens with a relatable, urgent expression`,s:fit(c.hook,['Stick with me for ten seconds and I will show you why.','Trust me on this one.']),d:'Fast-paced, direct, conversational'},
 prob:{v:`Medium selfie shot, ${n} gestures with one hand while ${p} rests nearby in the ${loc}`,s:fit(`I kept running into this: ${q.r}.`,['It was honestly driving me crazy.','Nothing I tried really fixed it.']),d:'Slightly frustrated, humorous, relatable'},
 intro:{v:`${n} picks up ${p} and tilts it to show its design and branding`,s:fit(`Then a friend told me about ${p}, so I finally figured, why not give it a try.`,['Honestly, best decision.']),d:'Curious, casual, small smile'},
 d1:{v:`Close-up as ${n} uses ${p}: ${c.use}`,s:fit(`Okay, watch this. ${cap(q.b)}.`,['Seriously, look at how easy that is.','I did not expect it to feel this good.']),d:'Excited but natural, gesturing toward the product'},
 d2:{v:`Close-up on ${ft} while ${n} keeps using ${p}`,s:fit(`Look at ${ft}, it is honestly so easy, and I use it every single day now.`,['That is what makes it worth it to me.']),d:'Warm, sincere, nodding'},
 r:{v:`${n} looks into the camera, genuinely surprised and smiling`,s:fit('I did not expect to like it this much, but here we are, and I am not mad about it.',['Seriously.']),d:'Honest reaction, light laugh'},
 pf:{v:`${n} adjusts ${p} casually in the ${loc}, relaxed`,s:fit('Two weeks in and I am still using it every day, which honestly says a lot coming from me.',['Really.']),d:'Matter-of-fact, confident'},
 cta:{v:`${n} holds ${p} at chest height and smiles at the camera`,s:fit(`Honestly, ${q.b}. ${cap(q.c)}.`,['Seriously, go check it out.']),d:'Warm, casual, like telling a friend'}};
 if(N==1)return[{...B.hook,s:fit(c.hook,['Honestly, '+q.c+'.','Seriously, go check it out.'])}];
 const mid=['prob','intro','d1','d2','r','pf'],m=N-2,seq=['hook'];
 for(let k=0;k<m;k++)seq.push(m==1?'intro':mid[Math.round(k*(mid.length-1)/Math.max(1,m-1))]);seq.push('cta');
 return seq.map(x=>B[x])}
const sig=()=>[S.d.nl,S.d.dur,S.concept,JSON.stringify(S.q),JSON.stringify(S.p),cn(),lo()].join('|');
async function startScript(){
 S.trBusy=true;S.trErr='';const sg=sig(),N=nScenes(),NL=S.d.nl||'English',c=concepts()[(S.concept||1)-1],q=Q();
 try{const sample=await getSample();if(!sample)throw 0;
  const r=await sample(`Write a UGC ad split into exactly ${N} scenes. EACH SCENE IS EXACTLY 10 SECONDS, one continuous smartphone-style shot with one spoken line.\nPRODUCT: "${pn()}" (${pDesc()||'n/a'}). CREATOR: ${cn()}. LOCATION: ${lo()}.\nCONCEPT: ${c.title}. Hook (scene 1 must open with this idea): "${c.hook}". Product in use: ${c.use}. Payoff: ${c.payoff}.\nCUSTOMER PROBLEM: ${q.r}. MAIN BENEFIT: ${q.b}. SOFT CTA (final scene only, once): ${q.c}.\nRULES: "spoken" is written in ${NL}, 18-25 words (about 10 seconds of natural speech), first-person casual creator talking to camera, contractions, personal-experience claims, never ad copy, no "Introducing" and no "Say goodbye to". Story flow across scenes: hook → relatable problem → product introduced naturally → demo (product actually being used, matching its real features) → honest reaction → ONE soft CTA at the very end. It must feel like ONE authentic creator video. "visual" is in English: the exact action of ${cn()} with the product, framing and location area, fully consistent with the product description; NO text, captions or graphics on screen. "delivery" is in English: tone, energy, gesture. The creator is the only speaker.\nReturn ONLY a JSON array of exactly ${N} objects: {"visual":"","spoken":"","delivery":""}.`,{cache:false});
  const a=JSON.parse(r.text.match(/\[[\s\S]*\]/)[0]);if(a.length!=N)throw 0;S.scr=a.map(x=>({v:String(x.visual).replace(/\.$/,''),s:x.spoken,d:String(x.delivery).replace(/\.$/,'')}))}
 catch(e){S.scr=null;S.trErr=t('Auto-writing unavailable — a template script (English, 18–25 words per scene) was used.','Penulisan otomatis tidak tersedia — dipakai skrip template (Inggris, 18–25 kata per adegan).')}
 S.trSig=sg;S.trBusy=false;render()}
function videos(){
 const N=nScenes(),NL=S.d.nl||'English',n=cn(),p=pn(),loc=lo(),c=concepts()[(S.concept||1)-1];
 const sc=S.scr&&S.scr.length==N?S.scr:tplScenes(N),out=[];
 for(let k=0;k<N;k++){const x=sc[k];out.push([`VIDEO PROMPT ${k+1} OF ${N} (${mmss(k*10)}–${mmss(k*10+10)})`,
 `REFERENCES: Use the attached Character Sheet, Product Sheet and Location Sheet as the only identity references. Same face, hair, outfit, body, product design, branding and location in every frame. 9:16 vertical, authentic smartphone UGC look (${c.film}), natural lighting, slight handheld movement, no cinematic effects. One continuous 10-second shot.`,
 `NO TEXT: There is no on-screen text of any kind: no captions, subtitles, titles, overlays, stickers, emojis, graphics, watermarks or UI. The only readable text is the real printed branding on the physical product.`,
 `AUDIO: The only voice is ${n} speaking the Spoken Line below, naturally paced across the full 10 seconds. Only natural ambient room sound is allowed. No background music, no voice-over, no narrator, no other voices, no added sound effects.`,
 `NARRATION LANGUAGE: ${NL}. The Spoken Line is spoken in ${NL}. All other instructions are in English.`,
 `CONTINUITY: ${k==0?'Opening video — hook in the first 3 seconds':`Continues directly from Video ${k}: ${n} holding ${p} at chest height in the ${loc}, same framing and energy.`}`,'',
 `(Shot: ${mmss(k*10)}–${mmss(k*10+10)})`,`- Visual: ${x.v}.`,`- Spoken Line (${NL}, ${wc(x.s)} words): "${x.s}"`,`- Delivery: ${x.d}.`,
 `END FRAME: ${n} holding ${p} at chest height, looking at the camera, ${loc} behind them.`,'',
 NEG+'on-screen text, captions, subtitles, text overlays, stickers, emojis, graphics, watermark, background music, voice-over, narrator, extra voices, sound effects, cinematic polish, drone or crane or dolly moves, TV-commercial look, studio lighting, different face or outfit between scenes, altered product design or logo, extra people, distorted hands'].join('\n'))}
 return out}

 ${nav('✅ APPROVED — '+t('lock character','kunci karakter'),'cL')}`,

 ${opt(t('B — Create a product for me','B — Buatkan produk untuk saya'),t('Pick the product settings.','Pilih pengaturan produk.'),"S.pm='B';go('pB')")}`,

l0:()=>{const L='ABCDE';return `<h2>${t('Stage 3 — Location','Stage 3 — Lokasi')}</h2><p class="hint">${t('Which location do you want to use?','Lokasi mana yang ingin dipakai?')} (${esc(pn())} + ${esc(cn())})</p>

lL:()=>lockBox('LOCATION LOCKED','STAGE 3 COMPLETE — Location',t('Should I generate the 10 UGC ad concepts?','Generate 10 konsep iklan UGC?'),'k0',t('Yes, go to Stage 4 (Concepts) →','Ya, lanjut Stage 4 (Konsep) →')),
k0:()=>{qFix();return `<h2>${t('Stage 4 — 10 UGC Ad Concepts','Stage 4 — 10 Konsep Iklan UGC')}</h2><p class="hint">${t('The options below match your product category','Opsi di bawah menyesuaikan kategori produkmu')}: <b>${esc(cat())}</b>. ${t('The 10 concepts are written for your exact product.','10 konsep ditulis khusus untuk produkmu.')}</p>
 ${chips('q','prob',t('Customer problem','Masalah customer'),probL())}${chips('q','benefit',t('Main benefit / honest reaction','Manfaat utama / reaksi jujur'),benL())}${chips('q','cta',t('Soft call to action','Soft CTA'),O.cta)}${nav(t('Yes, generate 10 concepts →','Ya, buat 10 konsep →'),'k1')}`},
k1:()=>{if(S.csSig!==pSig()){if(!S.csBusy)startConcepts();return `<h2>Stage 4</h2><p class="hint">⏳ ${t('Writing 10 concepts for','Menulis 10 konsep untuk')} ${esc(pn())}…</p>`}

d0:()=>`<h2>${t('Stage 5 — Duration & Narration','Stage 5 — Durasi & Narasi')}</h2><div class="lock">CONCEPT ${S.concept} SELECTED</div><p class="hint" style="margin-top:8px">${t('What video duration do you want (seconds)?','Durasi video berapa detik?')}</p>
 ${durField()}${nlField()}
 <p class="note">${t('Prompts stay in English; only the narration uses the language you pick, and the video model is told which language to speak.','Prompt tetap bahasa Inggris; hanya narasi yang memakai bahasa pilihanmu, dan model video diberi tahu bahasa yang diucapkan.')}</p>${nav(t('Generate video prompts →','Buat video prompt →'),'v0',"S.d.dur=Math.min(60,Math.max(10,+S.d.dur||20));S.d.nl=S.d.nl||'English';")}`,

 if(S.trSig!==sig()){if(!S.trBusy)startScript();return `<h2>Stage 6</h2><p class="hint">⏳ ${t('Writing scene scripts…','Menulis skrip adegan…')}</p>`}
 const r=videos();return `<h2>${t('Stage 6 — Video Prompts (Omni Flash)','Stage 6 — Video Prompt (Omni Flash)')}</h2><p class="hint">${t('Concept','Konsep')} #${S.concept} · ${S.d.dur}s · ${r.length} ${t('scenes × 10 seconds','adegan × 10 detik')} · ${t('Narration','Narasi')}: ${esc(NL)}. ${t('Each scene has 18–25 spoken words, no on-screen text, and no sound except the creator and natural ambience.','Tiap adegan 18–25 kata, tanpa teks di layar, dan tanpa suara selain kreator dan suara natural.')}</p>
 ${S.trErr?`<p class="note">⚠️ ${esc(S.trErr)}</p>`:''}${blk(t('Copy all prompts','Salin semua prompt'),r.join('\n\n────────\n\n'))}${r.map((x,i)=>blk(`VIDEO PROMPT ${i+1} / ${r.length}`,x)).join('')}
 <div class="lock">✅ ALL STAGES COMPLETE</div>${upsell()}<pre style="margin-top:8px">${t('1) Generate Video 1 in Omni Flash with the three sheets attached.\n2) Use the last frame of each video as the start frame of the next.\n3) Join all videos in order in a video editor.','1) Generate Video 1 di Omni Flash dengan 3 sheet terlampir.\n2) Pakai last frame tiap video sebagai start frame video berikutnya.\n3) Gabungkan semua video secara berurutan di video editor.')}</pre>${nav('','k1')}`}
};
const STG=()=>[t('Character','Karakter'),t('Product','Produk'),t('Location','Lokasi'),t('Concept','Konsep'),t('Duration','Durasi'),t('Video','Video')];
function render(keep){
 C.length=0;const g=stageOf(S.st),y=scrollY;
 document.getElementById('tag').textContent=t('UGC ad prompts for Omni Flash · 9:16','Prompt iklan UGC untuk Omni Flash · 9:16');
 document.getElementById('bn').innerHTML=`<span>✓ <b>${t('Unlocked local version','Versi lokal terbuka')}</b> — ${t('All interface options enabled: 10 concepts, 10–60 seconds, custom fields and uploads.','Semua opsi antarmuka aktif: 10 konsep, 10–60 detik, kolom kustom dan upload.')}</span>`;
 document.getElementById('lang').innerHTML=['en','id'].map(l=>`<button class="${S.lang==l?'on':''}" onclick="S.lang='${l}';render(true)">${l.toUpperCase()}</button>`).join('');
 document.getElementById('pg').innerHTML=STG().map((n,i)=>`<div class="${i+1==g?'on':i+1<g?'dn':''}"><b></b>${i+1<g?'✓ ':''}${n}</div>`).join('');
 document.getElementById('panel').innerHTML=TT[S.st]();
 if(keep)scrollTo(0,y);
}
render();
